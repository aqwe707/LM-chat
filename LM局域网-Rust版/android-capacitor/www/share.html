<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>文件共享 - LM Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100dvh;display:flex;flex-direction:column}
header{background:#fff;padding:14px 16px;border-bottom:1px solid #e5e5ea;display:flex;align-items:center;gap:12px}
header h1{font-size:17px;font-weight:700;flex:1}
header a{color:#0071e3;text-decoration:none;font-size:14px}
#upload-area{padding:16px;background:#fff;margin:12px;border-radius:14px}
#upload-area label{display:block;padding:20px;border:2px dashed #d1d1d6;border-radius:12px;text-align:center;color:#86868b;font-size:15px;cursor:pointer}
#upload-area input{display:none}
#files{flex:1;padding:0 12px 12px}
.file{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:12px;margin-bottom:8px}
.file .icon{font-size:28px}
.file .info{flex:1;min-width:0}
.file .name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta{font-size:12px;color:#86868b}
.file button{background:none;border:none;font-size:18px;padding:6px;cursor:pointer;flex-shrink:0}
.file .dl{color:#0071e3}.file .rm{color:#ff3b30}
#empty{text-align:center;padding:40px;color:#86868b;font-size:14px}
</style>
</head>
<body>
<header><h1>文件共享</h1><a href="/">← 聊天</a></header>
<div id="upload-area">
  <label>点击上传文件（最大 10GB）</label><input type="file" id="fileInput" multiple onchange="doUpload()">
</div>
<div id="files"><div id="empty">暂无文件</div></div>
<script>
async function loadFiles(){
  const r=await fetch('/api/files');const files=await r.json();
  const d=document.getElementById('files');
  if(!files.length){d.innerHTML='<div id="empty">暂无文件</div>';return}
  d.innerHTML=files.map(f=>{
    const ext=f.name.split('.').pop().toLowerCase();
    const iconmap={jpg:'image',jpeg:'image',png:'image',gif:'image',mp4:'video',mp3:'music',pdf:'document',zip:'archive',rar:'archive',doc:'file',docx:'file',txt:'document'};
    const icon=iconmap[ext]||'file';
    const size=f.size<1024?f.size+'B':f.size<1048576?(f.size/1024).toFixed(1)+'KB':(f.size/1048576).toFixed(1)+'MB';
    return '<div class="file"><span class="icon">'+icon+'</span><div class="info"><div class="name">'+f.name+'</div><div class="meta">'+size+' · '+new Date(f.time).toLocaleString('zh-CN')+'</div></div><button class="dl" onclick="downloadFile(\''+f.name+'\')">DL</button><button class="rm" onclick="deleteFile(\''+f.name+'\')">RM</button></div>';
  }).join('');
}
async function doUpload(){const inp=document.getElementById('fileInput');if(!inp.files.length)return;const fd=new FormData();for(const f of inp.files)fd.append('files',f);await fetch('/api/upload',{method:'POST',body:fd});inp.value='';loadFiles()}
function downloadFile(name){window.open('/api/download/'+encodeURIComponent(name))}
async function deleteFile(name){if(!confirm('Delete?'))return;await fetch('/api/files/'+encodeURIComponent(name),{method:'DELETE'});loadFiles()}
loadFiles();
</script>
</body>
</html>
