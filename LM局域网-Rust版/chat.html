<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LM Chat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LM Chat">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1d1d1f;height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

#lock{position:fixed;inset:0;background:#f5f5f7;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#lock h2{font-size:24px;font-weight:700}
#lock input{width:220px;padding:16px;border-radius:14px;border:1px solid #d1d1d6;background:#fff;font-size:17px;text-align:center;outline:none}
#lock button{padding:14px 60px;border-radius:26px;border:none;background:#0071e3;color:#fff;font-size:17px;font-weight:600}
#lock .err{color:#ff3b30;font-size:14px;display:none}

#bar{display:none;background:rgba(245,245,247,.9);backdrop-filter:blur(20px);border-bottom:1px solid #e5e5ea;padding:10px 14px;align-items:center;gap:8px;flex-wrap:wrap}
#bar button,#bar a{padding:9px 14px;border-radius:20px;border:none;background:#0071e3;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none;cursor:pointer}
#bar a{background:#e8e8ed;color:#0071e3}

#msgs{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.msg{margin-bottom:10px}
.msg .bubble{max-width:85%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.5;word-break:break-word}
.msg.user{text-align:right}.msg.user .bubble{display:inline-block;background:#0071e3;color:#fff;border-bottom-right-radius:6px}
.msg.bot .bubble{display:inline-block;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);border-bottom-left-radius:6px}
.msg .bubble img{max-width:200px;max-height:200px;border-radius:10px;margin:4px 0}
.msg.system{text-align:center}.msg.system .bubble{background:none;color:#86868b;font-size:13px;padding:8px}
.typing{display:flex;gap:5px;padding:6px 0}.typing span{width:8px;height:8px;border-radius:50%;background:#c7c7cc;animation:dot 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}

#foot{display:none;padding:12px;background:#f5f5f7;border-top:1px solid #e5e5ea}
#preview{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
#preview .thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;position:relative}
#preview .thumb img{width:100%;height:100%;object-fit:cover}
#preview .thumb .x{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center}
#foot form{display:flex;gap:8px;align-items:flex-end}
#foot .btns{display:flex;gap:4px}
#foot .btns label{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#0071e3;cursor:pointer;overflow:hidden;position:relative}
#foot .btns label:active{background:rgba(0,0,0,.06)}
#foot .btns label input[type=file]{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
#foot textarea{flex:1;border:none;background:none;font-size:16px;padding:10px 0;outline:none;resize:none;font-family:inherit;line-height:1.4;max-height:100px}
#foot button[type=submit]{width:44px;height:44px;border-radius:50%;border:none;background:#0071e3;color:#fff;font-size:20px;flex-shrink:0}

#sidebar{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:none}
#sidebar .panel{position:absolute;top:0;left:0;bottom:0;width:300px;max-width:85vw;background:#fff;display:flex;flex-direction:column}
#sidebar .ph{padding:16px;border-bottom:1px solid #e5e5ea;display:flex;align-items:center;justify-content:space-between}
#sidebar .ph h3{font-size:16px;font-weight:700}
#sidebar .ph button{background:none;border:none;font-size:20px;color:#86868b;cursor:pointer}
#sidebar .list{flex:1;overflow-y:auto;padding:8px}
#sidebar .item{padding:12px;border-radius:10px;cursor:pointer;margin-bottom:2px;position:relative}
#sidebar .item:hover{background:#f5f5f7}
#sidebar .item.active{background:#e8f0fe}
#sidebar .item .name{font-size:14px;font-weight:500;padding-right:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidebar .item .preview{font-size:12px;color:#86868b;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidebar .item .del{position:absolute;right:12px;top:12px;color:#ff3b30;font-size:14px;opacity:.5;cursor:pointer}
#sidebar .item:hover .del{opacity:1}
#sidebar .add{padding:12px;text-align:center;color:#0071e3;font-size:14px;font-weight:600;cursor:pointer;border-top:1px solid #e5e5ea}

/* Settings modal */
#settings-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
#settings-overlay.show{display:flex}
#settings-box{background:#fff;border-radius:16px;padding:20px;width:90%;max-width:420px;max-height:80vh;overflow-y:auto}
#settings-box h3{font-size:17px;font-weight:700;margin-bottom:12px}
#settings-box label{display:block;font-size:13px;color:#86868b;margin-bottom:4px}
#settings-box textarea{width:100%;height:120px;padding:12px;border-radius:10px;border:1px solid #d1d1d6;font-size:14px;font-family:inherit;outline:none;resize:vertical;margin-bottom:12px}
#settings-box textarea:focus{border-color:#0071e3}
#settings-box input[type=range]{width:100%;margin-bottom:8px}
#settings-box .row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
#settings-box .row span{font-size:13px;min-width:40px;text-align:right}
#settings-box button{padding:10px 20px;border-radius:20px;border:none;font-size:14px;font-weight:600;cursor:pointer}
#settings-box .btn-save{background:#0071e3;color:#fff;margin-right:8px}
#settings-box .btn-cancel{background:#e8e8ed;color:#1d1d1f}
#settings-box .btn-save:disabled{opacity:.5}
</style>
</head>
<body>

<div id="lock">
  <h2>LM Chat</h2>
  <input id="pwd" type="password" placeholder="杈撳叆瀵嗙爜">
  <button onclick="doUnlock()">杩涘叆</button>
  <div class="err" id="err">密码错误</div>
</div>

<div id="bar">
  <button onclick="toggleSidebar()">鈽?瀵硅瘽</button>
  <button onclick="newChat()" style="background:none;color:#0071e3;border:1px solid #0071e3">锛?/button>
  <button onclick="showSettings()" style="background:#e8e8ed;color:#1d1d1f">鈿?/button>
  <a href="/share">馃搧</a>
</div>

<div id="sidebar" onclick="if(event.target===this)toggleSidebar()">
  <div class="panel">
    <div class="ph"><h3>瀵硅瘽璁板綍</h3><button onclick="toggleSidebar()">鉁?/button></div>
    <div class="list" id="sessionList"></div>
    <div class="add" onclick="newChat();toggleSidebar()">锛?鏂板缓瀵硅瘽</div>
  </div>
</div>

<div id="settings-overlay" onclick="if(event.target===this)hideSettings()">
  <div id="settings-box">
    <h3>系统提示词/h3>
    <label id="sidDisplay" style="font-size:11px;color:#86868b;margin-bottom:8px;display:block">瀵硅瘽ID: 鈥?/label>
    <label>每个对话独立设置，不影响其他对话</label>
    <textarea id="sysPrompt"></textarea>
    <button class="btn-save" onclick="saveSettings()">淇濆瓨</button>
    <button class="btn-cancel" onclick="hideSettings()">鍙栨秷</button>
  </div>
</div>

<div id="msgs"></div>

<div id="foot">
  <div id="preview"></div>
  <form onsubmit="doSend();return false">
    <div class="btns">
      <label>馃摲<input type="file" accept="image/*" capture="environment" onchange="addFiles(this)"></label>
      <label>馃搧<input type="file" accept="*/*" onchange="addFiles(this)"></label>
    </div>
    <textarea id="input" rows="1" placeholder="输入消息…（Ctrl+回车发送）" onkeydown="onInputKey(event)"></textarea>
    <button type="submit">鈫?/button>
  </form>
</div>

<script>
let PASS='',SID='',images=[],sessions=[],currentMsgs=[];

function genId(){return 's'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}
function LS(k,v){if(v!==undefined){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function saveSid(){localStorage.setItem('lm_sid',SID)}

// 鈹€鈹€ 服务端加载对话列表鈹€鈹€
async function loadSessions(){
  try{
    const r=await fetch('/api/sessions');sessions=await r.json();
  }catch(e){sessions=[]}
}
async function loadMsgs(sid){
  try{
    const r=await fetch('/api/sessions/'+sid);const s=await r.json();
    return (s&&s.messages)||[];
  }catch(e){return []}
}

// ── Init ──
(async function(){
  await loadSessions();
  SID=localStorage.getItem('lm_sid');
  if(!SID||!sessions.find(s=>s.id===SID)){SID=genId();saveSid()}
  currentMsgs=await loadMsgs(SID);
  currentMsgs.forEach(m=>renderMsg(m.role,m.content,m.images));
})();

// ── Auth ──
async function doUnlock(){
  const p=document.getElementById('pwd').value.trim();if(!p)return;
  try{
    const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})});
    if((await r.json()).ok){PASS=p;localStorage.setItem('lm_pass',p);
      document.getElementById('lock').style.display='none';
      document.getElementById('bar').style.display='flex';
      document.getElementById('foot').style.display='block';
      if(!currentMsgs.length)addMsg('system','新对话);
    }else{document.getElementById('err').style.display='block'}
  }catch(e){document.getElementById('err').style.display='block'}
}
(function(){const sp=localStorage.getItem('lm_pass');if(sp){document.getElementById('pwd').value=sp;doUnlock()}})();

// ── Messages ──
function addMsg(role,content,imgs){
  const entry={role,content,images:imgs||null};
  currentMsgs.push(entry);
  renderMsg(role,content,imgs);
}
function renderMsg(role,content,imgs){
  const d=document.getElementById('msgs');
  const el=document.createElement('div');el.className='msg '+role;
  let html='';if(content)html+=fmt(content);if(imgs&&imgs.length)html+=imgs.map(i=>`<img src="${i}">`).join('');
  el.innerHTML='<div class="bubble">'+html+'</div>';
  d.appendChild(el);d.scrollTop=d.scrollHeight;
}
function fmt(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}

// ── Sidebar ──
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  if(sb.style.display==='block'){sb.style.display='none';return}
  sb.style.display='block';renderSessionList();
}
function renderSessionList(){
  const list=document.getElementById('sessionList');
  list.innerHTML=sessions.map(s=>`
    <div class="item${s.id===SID?' active':''}" onclick="switchSession('${s.id}')">
      <span class="del" onclick="event.stopPropagation();deleteSession('${s.id}')">馃棏</span>
      <div class="name">${s.name||'新对话}</div>
      <div class="preview">${s.preview||'鏆傛棤娑堟伅'}</div>
    </div>
  `).join('')||'<div style="color:#86868b;padding:20px;text-align:center">鏆傛棤瀵硅瘽</div>';
}
async function switchSession(sid){
  if(sid===SID)return toggleSidebar();
  SID=sid;saveSid();
  currentMsgs=await loadMsgs(SID);
  document.getElementById('msgs').innerHTML='';
  currentMsgs.forEach(m=>renderMsg(m.role,m.content,m.images));
  toggleSidebar();
}
async function deleteSession(sid){
  if(!confirm('鍒犻櫎杩欐潯瀵硅瘽璁板綍锛?))return;
  await fetch('/api/sessions/'+sid,{method:'DELETE'});
  sessions=sessions.filter(s=>s.id!==sid);
  if(sid===SID){newChat();return}
  renderSessionList();
}
function newChat(){
  SID=genId();saveSid();
  currentMsgs=[];
  document.getElementById('msgs').innerHTML='';
  addMsg('system','新对话);
  fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:SID,passcode:PASS})}).catch(()=>{});
  loadSessions().then(renderSessionList);
}

// ── Send ──
async function doSend(){
  const inp=document.getElementById('input');const msg=inp.value.trim();
  const imgs=[...images];if(!msg&&!imgs.length)return;
  addMsg('user',msg||'',imgs.length?imgs:null);
  inp.value='';clearImages();
  const loadEl=document.createElement('div');loadEl.className='msg bot';
  loadEl.innerHTML='<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  document.getElementById('msgs').appendChild(loadEl);
  try{
    const body={sessionId:SID,passcode:PASS,systemPrompt:getPrompt(SID)};
    if(msg)body.message=msg;if(imgs.length)body.images=imgs;
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const reply=(await r.json()).reply||'[绌篯';
    loadEl.innerHTML='<div class="bubble">'+fmt(reply)+'</div>';
    currentMsgs.push({role:'bot',content:reply});
    loadSessions();
  }catch(e){loadEl.innerHTML='<div class="bubble" style="color:#ff3b30">网络错误</div>'}
}

// ── Files ──
function addFiles(input){for(const f of input.files){const r=new FileReader();r.onload=function(e){images.push(e.target.result);showPreview()};r.readAsDataURL(f)}input.value=''}
function showPreview(){document.getElementById('preview').innerHTML=images.map((img,i)=>`<div class="thumb"><img src="${img}"><span class="x" onclick="removeImg(${i})">鉁?/span></div>`).join('')}
function removeImg(i){images.splice(i,1);showPreview()}
function clearImages(){images=[];document.getElementById('preview').innerHTML=''}

// ── Settings ──
const DEFAULT_PROMPT='你是一个有用的AI助手，请用中文回答。回答简洁准确。;
let settingsSid='';
function getPrompt(sid){return localStorage.getItem('lm_prompt_'+sid)||DEFAULT_PROMPT}

function showSettings(){
  settingsSid=SID;
  document.getElementById('settings-overlay').classList.add('show');
  document.getElementById('sysPrompt').value=getPrompt(settingsSid);
  document.getElementById('sidDisplay').textContent='瀵硅瘽ID: '+settingsSid.slice(-8);
}
function hideSettings(){document.getElementById('settings-overlay').classList.remove('show')}
function saveSettings(){
  localStorage.setItem('lm_prompt_'+settingsSid,document.getElementById('sysPrompt').value);
  hideSettings();
}

document.getElementById('input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'});

// 蹇嵎閿細鍙矯trl+鍥炶溅鍙戦€侊紝鍥炶溅鎹㈣
function onInputKey(e){
  if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();doSend()}
}
</script>
</body>
</html>
