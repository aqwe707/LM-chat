            - paragraph [ref=e817]: "Some models tokenize images by covering them with 32px x 32px patches. Each model defines a maximum patch budget. The token cost of an image is determined as follows:"
            - paragraph [ref=e818]: A. Compute how many 32px x 32px patches are needed to cover the original image. A patch may extend beyond the image boundary.
            - generic [ref=e821]:
              - button [ref=e823] [cursor=pointer]:
                - img [ref=e827]
              - code [ref=e830]:
                - generic [ref=e831]: original_patch_count = ceil(width/32)×ceil(height/32)
            - paragraph [ref=e832]: B. If the original image would exceed the model’s patch budget, scale it down proportionally until it fits within that budget. Then adjust the scale so the final resized image stays within budget after converting to integer pixel dimensions and computing patch coverage.
            - generic [ref=e835]:
              - button [ref=e837] [cursor=pointer]:
                - img [ref=e841]
              - code [ref=e844]:
                - generic [ref=e845]: shrink_factor = sqrt((32^2 * patch_budget) / (width * height))
                - generic [ref=e846]: adjusted_shrink_factor = shrink_factor * min(
                - generic [ref=e847]: floor(width * shrink_factor / 32) / (width * shrink_factor / 32),
                - generic [ref=e848]: floor(height * shrink_factor / 32) / (height * shrink_factor / 32)
                - text: )
            - paragraph [ref=e849]: C. Convert the adjusted scale into integer pixel dimensions, then compute the number of patches needed to cover the resized image. This resized patch count is the image-token count before applying the model multiplier, and it is capped by the model’s patch budget.
            - generic [ref=e852]:
              - button [ref=e854] [cursor=pointer]:
                - img [ref=e858]
              - code [ref=e861]:
                - generic [ref=e862]: resized_patch_count = ceil(resized_width/32)×ceil(resized_height/32)
            - paragraph [ref=e863]: "D. Apply a multiplier based on the model to get the total tokens:"
