            - paragraph [ref=e1002]: "While models with vision capabilities are powerful and can be used in many situations, it’s important to understand the limitations of these models. Here are some known limitations:"
            - list [ref=e1003]:
              - listitem [ref=e1004]:
                - strong [ref=e1005]: Medical images
                - text: ": The model is not suitable for interpreting specialized medical images like CT scans and shouldn’t be used for medical advice."
              - listitem [ref=e1006]:
                - strong [ref=e1007]: Non-English
                - text: ": The model may not perform optimally when handling images with text of non-Latin alphabets, such as Japanese or Korean."
              - listitem [ref=e1008]:
