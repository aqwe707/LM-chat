              - text: . This lets you iterate on images across multiple turns—refining prompts, applying new instructions, and evolving the visual output as the conversation progresses.
            - paragraph [ref=e642]:
              - text: With the Responses API image generation tool, supported tool models can choose whether to generate a new image or edit one already in the conversation. The optional
