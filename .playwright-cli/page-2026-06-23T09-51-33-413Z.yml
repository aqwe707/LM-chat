                - text: IDs as input images, not just bytes
            - paragraph [ref=e553]:
              - text: The Responses API image generation tool uses its own GPT Image model selection. For details on mainline models that support calling this tool, refer to the
              - link "supported models" [ref=e554] [cursor=pointer]:
                - /url: "#supported-models"
