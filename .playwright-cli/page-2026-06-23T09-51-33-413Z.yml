                - img [ref=e558]
            - list [ref=e560]:
              - listitem [ref=e561]: If you only need to generate or edit a single image from one prompt, the Image API is your best choice.
              - listitem [ref=e562]: If you want to build conversational, editable image experiences with GPT Image, go with the Responses API.
            - paragraph [ref=e563]: With the Image API, you choose a GPT Image model directly. With the Responses API, you choose a mainline model that supports the image generation tool; the tool handles GPT Image model selection. Responses API requests include the mainline model’s token usage in addition to image generation costs.
            - paragraph [ref=e564]:
              - text: Both APIs let you
              - link "customize output" [ref=e565] [cursor=pointer]:
                - /url: "#customize-image-output"
              - text: by adjusting quality, size, format, and compression. Transparent backgrounds depend on model support.
            - paragraph [ref=e566]: This guide focuses on GPT Image.
