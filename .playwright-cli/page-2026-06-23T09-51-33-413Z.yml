              - code [ref=e1377]: 5xx
              - text: ", but not for image generation user errors that require changing the request."
            - paragraph [ref=e1378]:
              - text: Some image generation failures are user-correctable and may return
              - code [ref=e1379]: error.type = "image_generation_user_error"
              - text: . Don’t automatically retry these errors without modifying the prompt or input images. For programmatic handling, use
              - code [ref=e1380]: error.code
              - text: as the stable discriminator.
