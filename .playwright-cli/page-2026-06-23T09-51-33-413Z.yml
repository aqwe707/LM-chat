              - text: The
              - link "Responses API" [ref=e544] [cursor=pointer]:
                - /url: /api/docs/api-reference/responses/create#responses-create-tools
              - text: allows you to generate images as part of conversations or multi-step flows. It supports image generation as a
              - link "built-in tool" [ref=e545] [cursor=pointer]:
                - /url: /api/docs/guides/tools?api-mode=responses
              - text: ", and accepts image inputs and outputs within context."
            - paragraph [ref=e546]: "Compared to the Image API, it adds:"
            - list [ref=e547]:
              - listitem [ref=e548]:
                - strong [ref=e549]: Multi-turn editing
                - text: ": Iteratively make high fidelity edits to images with prompting"
              - listitem [ref=e550]:
