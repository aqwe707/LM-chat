[package]
name = "lm-chat"
version = "1.0.0"
edition = "2021"
description = "Mobile web chat UI for LM Studio — single binary, zero dependencies"

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
actix-files = "0.6"
awc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
local-ip-address = "0.6"
futures-util = "0.3"
