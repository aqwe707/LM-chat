<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LM Chat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1d1d1f;height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

#lock{position:fixed;inset:0;background:#f5f5f7;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#lock h2{font-size:24px;font-weight:700}
#lock input{width:220px;padding:16px;border-radius:14px;border:1px solid #d1d1d6;background:#fff;font-size:17px;text-align:center;outline:none}
#lock button{padding:14px 60px;border-radius:26px;border:none;background:#0071e3;color:#fff;font-size:17px;font-weight:600}
#lock .err{color:#ff3b30;font-size:14px;display:none}

#bar{display:none;background:rgba(245,245,247,.9);backdrop-filter:blur(20px);border-bottom:1px solid #e5e5ea;padding:12px 16px;display:none;align-items:center;gap:10px}
#bar select{flex:1;padding:10px;border-radius:10px;border:1px solid #d1d1d6;background:#fff;font-size:14px;max-width:65%}
#bar button{padding:10px 16px;border-radius:20px;border:none;background:#0071e3;color:#fff;font-size:14px;font-weight:600;white-space:nowrap}

#msgs{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.msg{margin-bottom:12px}
.msg .bubble{max-width:85%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.5;word-break:break-word}
.msg.user{text-align:right}.msg.user .bubble{display:inline-block;background:#0071e3;color:#fff;border-bottom-right-radius:6px}
.msg.bot .bubble{display:inline-block;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);border-bottom-left-radius:6px}
.msg .bubble img{max-width:200px;max-height:200px;border-radius:10px;margin:4px 0}
.msg.system{text-align:center}.msg.system .bubble{background:none;color:#86868b;font-size:13px;padding:8px}
.typing{display:flex;gap:5px;padding:6px 0}.typing span{width:8px;height:8px;border-radius:50%;background:#c7c7cc;animation:dot 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}

#foot{display:none;padding:12px;background:#f5f5f7;border-top:1px solid #e5e5ea}
#preview{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
#preview .thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;position:relative}
#preview .thumb img{width:100%;height:100%;object-fit:cover}
#preview .thumb .x{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center}
#foot form{display:flex;gap:8px;align-items:flex-end}
#foot .btns{display:flex;gap:4px}
#foot .btns label{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#0071e3;cursor:pointer;overflow:hidden;position:relative}
#foot .btns label:active{background:rgba(0,0,0,.06)}
#foot .btns label input[type=file]{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
#foot textarea{flex:1;border:none;background:none;font-size:16px;padding:10px 0;outline:none;resize:none;font-family:inherit;line-height:1.4;max-height:100px}
#foot button[type=submit]{width:44px;height:44px;border-radius:50%;border:none;background:#0071e3;color:#fff;font-size:20px;flex-shrink:0}
</style>
</head>
<body>

<div id="lock">
  <h2>LM Chat</h2>
  <input id="pwd" type="password" placeholder="输入密码">
  <button onclick="doUnlock()">进入</button>
  <div class="err" id="err">密码错误</div>
</div>

<div id="bar">
  <select id="modelSelect" onchange="saveModel()"><option value="">默认模型</option></select>
  <button onclick="newChat()">新对话</button>
</div>

<div id="msgs"></div>

<div id="foot">
  <div id="preview"></div>
  <form onsubmit="doSend();return false">
    <div class="btns">
      <label>📷<input type="file" accept="image/*" capture="environment" onchange="addFiles(this)"></label>
      <label>📁<input type="file" accept="*/*" onchange="addFiles(this)"></label>
    </div>
    <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
    <button type="submit">↑</button>
  </form>
</div>

<script>
let PASS='',SID='s'+Date.now(),msgs=[],images=[],sessions=[];

function S(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function L(k,d){try{return JSON.parse(localStorage.getItem(k))}catch{return d}}
function sid(){return's'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}

// ── Auth ──
async function doUnlock(){
  const p=document.getElementById('pwd').value.trim();if(!p)return;
  try{
    const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:p})});
    if((await r.json()).ok){PASS=p;localStorage.setItem('lm_pass',p);
      document.getElementById('lock').style.display='none';
      document.getElementById('bar').style.display='flex';
      document.getElementById('foot').style.display='block';
      loadModels();if(!msgs.length)addMsg('system','新对话');
    }else{document.getElementById('err').style.display='block'}
  }catch(e){document.getElementById('err').style.display='block'}
}
(function(){const sp=localStorage.getItem('lm_pass');if(sp){document.getElementById('pwd').value=sp;doUnlock()}})();

async function loadModels(){
  try{
    const r=await fetch('/api/models');const j=await r.json();
    const sel=document.getElementById('modelSelect');
    sel.innerHTML='<option value="">默认模型</option>';
    (j.data||[]).forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.id;sel.appendChild(o)});
    const sm=localStorage.getItem('lm_model');if(sm&&[...sel.options].some(o=>o.value===sm))sel.value=sm;
  }catch(e){}
}
function saveModel(){localStorage.setItem('lm_model',document.getElementById('modelSelect').value)}

// ── Messages ──
function addMsg(role,content,imgs){
  msgs.push({role,content,images:imgs||null});
  renderMsg(role,content,imgs);
}
function renderMsg(role,content,imgs){
  const d=document.getElementById('msgs');
  const el=document.createElement('div');el.className='msg '+role;
  let html='';if(content)html+=fmt(content);if(imgs&&imgs.length)html+=imgs.map(i=>`<img src="${i}">`).join('');
  el.innerHTML='<div class="bubble">'+html+'</div>';
  d.appendChild(el);d.scrollTop=d.scrollHeight;
}
function fmt(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}

// ── Send ──
async function doSend(){
  const inp=document.getElementById('input');const msg=inp.value.trim();
  const imgs=[...images];if(!msg&&!imgs.length)return;
  addMsg('user',msg||'',imgs.length?imgs:null);
  inp.value='';clearImages();
  const loadEl=document.createElement('div');loadEl.className='msg bot';
  loadEl.innerHTML='<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  document.getElementById('msgs').appendChild(loadEl);
  const model=document.getElementById('modelSelect').value;
  try{
    const body={sessionId:SID,passcode:PASS,model};if(msg)body.message=msg;if(imgs.length)body.images=imgs;
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const reply=(await r.json()).reply||'[空]';
    loadEl.innerHTML='<div class="bubble">'+fmt(reply)+'</div>';
    msgs.push({role:'bot',content:reply});
  }catch(e){loadEl.innerHTML='<div class="bubble" style="color:#ff3b30">网络错误</div>'}
}

// ── Files ──
function addFiles(input){
  for(const f of input.files){
    const r=new FileReader();r.onload=function(e){images.push(e.target.result);showPreview()};r.readAsDataURL(f);
  }
  input.value='';
}
function showPreview(){
  document.getElementById('preview').innerHTML=images.map((img,i)=>`<div class="thumb"><img src="${img}"><span class="x" onclick="removeImg(${i})">✕</span></div>`).join('');
}
function removeImg(i){images.splice(i,1);showPreview()}
function clearImages(){images=[];document.getElementById('preview').innerHTML=''}

// ── Misc ──
function newChat(){msgs=[];SID=sid();document.getElementById('msgs').innerHTML='';addMsg('system','新对话')}
document.getElementById('input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'});
</script>
</body>
</html>
