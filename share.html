<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>文件共享 — LM Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100dvh;display:flex;flex-direction:column}
header{background:#fff;padding:14px 16px;border-bottom:1px solid #e5e5ea;display:flex;align-items:center;gap:12px}
header h1{font-size:17px;font-weight:700;flex:1}
header a{color:#0071e3;text-decoration:none;font-size:14px}
#upload-area{padding:16px;background:#fff;margin:12px;border-radius:14px}
#upload-area label{display:block;padding:20px;border:2px dashed #d1d1d6;border-radius:12px;text-align:center;color:#86868b;font-size:15px;cursor:pointer}
#upload-area input{display:none}
#files{flex:1;padding:0 12px 12px}
.file{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:12px;margin-bottom:8px}
.file .icon{font-size:28px}
.file .info{flex:1;min-width:0}
.file .name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta{font-size:12px;color:#86868b}
.file button{background:none;border:none;font-size:18px;padding:6px;cursor:pointer;flex-shrink:0}
.file .dl{color:#0071e3}.file .rm{color:#ff3b30}
#empty{text-align:center;padding:40px;color:#86868b;font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>文件共享</h1>
  <a href="/">← 聊天</a>
</header>

<div id="upload-area">
  <label>📤 点击上传文件（最大 10GB）<input type="file" id="fileInput" multiple onchange="doUpload()"></label>
</div>

<div id="files">
  <div id="empty">暂无文件</div>
</div>

<div class="toast" id="toast"></div>

<script>
async function loadFiles(){
  const r=await fetch('/api/files');const files=await r.json();
  const d=document.getElementById('files');
  if(!files.length){d.innerHTML='<div id="empty">暂无文件</div>';return}
  d.innerHTML=files.map(f=>`<div class="file">
    <span class="icon">${iconFor(f.name)}</span>
    <div class="info"><div class="name">${f.name}</div><div class="meta">${fmtSize(f.size)} · ${new Date(f.time).toLocaleString('zh-CN')}</div></div>
    <button class="dl" onclick="downloadFile('${f.name}')">⬇</button>
    <button class="rm" onclick="deleteFile('${f.name}')">🗑</button>
  </div>`).join('');
}
function iconFor(n){const e=n.split('.').pop().toLowerCase();return({jpg:'🖼',jpeg:'🖼',png:'🖼',gif:'🖼',webp:'🖼',mp4:'🎬',mp3:'🎵',pdf:'📄',zip:'📦',rar:'📦',doc:'📝',docx:'📝',txt:'📄'})[e]||'📁'}
function fmtSize(s){return s<1024?s+'B':s<1048576?(s/1024).toFixed(1)+'KB':(s/1048576).toFixed(1)+'MB'}
async function doUpload(){
  const inp=document.getElementById('fileInput');if(!inp.files.length)return;
  const fd=new FormData();for(const f of inp.files)fd.append('files',f);
  const r=await fetch('/api/upload',{method:'POST',body:fd});const j=await r.json();
  if(j.ok){inp.value='';loadFiles();toast('上传成功')}else{toast('上传失败')}
}
function downloadFile(name){window.open('/api/download/'+encodeURIComponent(name))}
async function deleteFile(name){if(!confirm('删除 '+name+' ?'))return;await fetch('/api/files/'+encodeURIComponent(name),{method:'DELETE'});loadFiles();toast('已删除')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(()=>t.className='toast',2000)}
loadFiles();
</script>
</body>
</html>
